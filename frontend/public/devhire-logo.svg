<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f5fc4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fa3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3d8c"/>
      <stop offset="100%" style="stop-color:#1a6fd4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f3d8c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Monitor body -->
  <rect x="6" y="6" width="72" height="52" rx="6" fill="#1a3a6b" filter="url(#shadow)"/>
  <!-- Monitor screen -->
  <rect x="11" y="11" width="62" height="42" rx="4" fill="url(#bgGrad)"/>
  <!-- Monitor stand -->
  <rect x="36" y="58" width="12" height="10" rx="2" fill="#1a3a6b"/>
  <!-- Monitor base -->
  <rect x="24" y="67" width="36" height="6" rx="3" fill="#1a3a6b"/>

  <!-- Screen: code tag -->
  <text x="16" y="38" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="white" opacity="0.95">&#60;/&#62;</text>

  <!-- Gear top right -->
  <circle cx="60" cy="20" r="6" fill="none" stroke="#f0c040" stroke-width="1.8"/>
  <circle cx="60" cy="20" r="2.5" fill="#f0c040"/>
  <line x1="60" y1="12.5" x2="60" y2="14.5" stroke="#f0c040" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="60" y1="25.5" x2="60" y2="27.5" stroke="#f0c040" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="52.5" y1="20" x2="54.5" y2="20" stroke="#f0c040" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="65.5" y1="20" x2="67.5" y2="20" stroke="#f0c040" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Lightbulb top left -->
  <ellipse cx="20" cy="18" rx="5" ry="6" fill="#f0c040" opacity="0.9"/>
  <rect x="17.5" y="23" width="5" height="3" rx="1" fill="#f0c040" opacity="0.7"/>
  <line x1="20" y1="10" x2="20" y2="8" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="13" x2="27.5" y2="11.5" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="13" x2="12.5" y2="11.5" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Green checkmark bottom right -->
  <circle cx="65" cy="45" r="7" fill="#38ef7d"/>
  <polyline points="61,45 64,48 69,41" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Search icon bottom left -->
  <circle cx="22" cy="44" r="5" fill="none" stroke="white" stroke-width="1.8" opacity="0.8"/>
  <line x1="26" y1="48" x2="29" y2="51" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- DevHire wordmark -->
  <text x="92" y="46" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="34" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">Dev</text>
  <text x="155" y="46" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, serif" font-size="34" font-weight="700" fill="#1a6fd4" letter-spacing="-0.5">Hire</text>

  <!-- Green dot -->
  <circle cx="151" cy="37" r="3.5" fill="#38ef7d"/>

  <!-- Tagline -->
  <text x="93" y="64" font-family="'Trebuchet MS', sans-serif" font-size="10" fill="#6b8cae" letter-spacing="2.5">YOUR NEXT HIRE STARTS HERE</text>

  <rect x="92" y="70" width="252" height="2" rx="1" fill="url(#textGrad)" opacity="0.15"/>
</svg>
